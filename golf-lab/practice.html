<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>練習計畫 | PAR/A</title>
  <meta name="description" content="暖身、練習場、推桿與切球練習菜單，加上 Up &amp; Down 挑戰計分卡。">
  <meta name="theme-color" content="#192821">
  <link rel="icon" type="image/png" href="assets/img/para-favicon.png">
  <link rel="apple-touch-icon" href="assets/img/para-mark.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="PAR/A">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="practice">
  <header id="site-header"></header>
  <main class="page">
    <header class="page-head wrap">
      <nav class="crumbs" aria-label="目前位置"><a href="index.html">首頁</a><span>/</span>練習</nav>
      <h1>練習計畫</h1>
      <p class="lead">去練習場前先選一份菜單，到了之後按下計時，照著一項一項做就好。第一次的話，建議從「新手練習場 40 分鐘」開始。不管練哪一份，都先做「暖身與空揮」。</p>
    </header>
    <div class="wrap">
      <div class="pill-tabs" role="tablist">
        <button type="button" role="tab" data-plan="w10">暖身與空揮 10 分鐘<small>Warm up</small></button>
        <button type="button" role="tab" data-plan="b40">新手練習場 40 分鐘<small>Beginner</small></button>
        <button type="button" role="tab" data-plan="r60">練習場 60 分鐘<small>Range</small></button>
        <button type="button" role="tab" data-plan="p30">推桿 30 分鐘<small>Putting</small></button>
        <button type="button" role="tab" data-plan="c30">切球 30 分鐘<small>Chipping</small></button>
      </div>
      <div class="practice-top">
        <div class="plan-card">
          <div id="planHead"></div>
          <div class="plan-bar" id="planBar"></div>
          <ol class="plan-list" id="planList"></ol>
        </div>
        <aside class="timer-card" id="timer" aria-live="polite"></aside>
      </div>

      <section class="game-sec" id="updown">
        <div class="game-head">
          <div><h2>Up &amp; Down 小挑戰</h2>
            <p>在果嶺周圍選 9 個位置，每站標準桿 2（一次切球 + 一次推桿）。點擊格子輸入桿數。</p></div>
          <div class="topar-box" id="udToPar"></div>
        </div>
        <div class="legend"><span><i class="c"></i>Birdie</span><span><i></i>Bogey</span><span><i class="dd"></i>D Bogey +</span></div>
        <div class="score-wrap" id="udCard"></div>
        <div class="game-foot"><ul class="stations" id="udStations"></ul><button type="button" class="btn ghost" id="udReset">清除計分卡</button></div>
        <div class="stats" id="udStats"></div>
      </section>
    </div>
  </main>

  <footer id="site-footer"></footer>
  <script src="assets/data.js"></script>
  <script src="assets/beginner.js"></script>
  <script src="assets/en.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
