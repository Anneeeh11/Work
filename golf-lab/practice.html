<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Practice Plans — 練習計畫 | The Golf Lab</title>
  <meta name="description" content="15 / 30 分鐘短桿練習菜單，加上 Up & Down 挑戰計分卡。">
  <meta name="theme-color" content="#063524">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%23006747'/%3E%3Cpath d='M12 25V8l10 4-10 4' fill='none' stroke='%23f2c75c' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="practice">
  <header id="site-header"></header>
  <main class="page">
    <header class="page-head wrap">
      <span class="eyebrow">Practice · 練習計畫</span>
      <h1>Practice Plans</h1>
      <p class="lead">沒有計畫的練習只是打球。選一份菜單、按下計時，照著做就好。</p>
    </header>
    <div class="wrap">
      <div class="pill-tabs" role="tablist">
        <button type="button" role="tab" data-plan="15">15 分鐘<small>Express</small></button>
        <button type="button" role="tab" data-plan="30">30 分鐘<small>Complete</small></button>
      </div>
      <div class="practice-top">
        <div class="plan-card">
          <div id="planHead"></div>
          <div class="plan-bar" id="planBar"></div>
          <ol class="plan-list" id="planList"></ol>
        </div>
        <aside class="timer-card" id="timer" aria-live="polite"></aside>
      </div>

      <section class="game-sec">
        <div class="game-head">
          <div><span class="eyebrow">Official Score Card</span><h2>Up &amp; Down Challenge</h2>
            <p>在果嶺周圍選 9 個位置，每站標準桿 2（一次切球 + 一次推桿）。點擊格子輸入桿數。</p></div>
          <div class="topar-box" id="udToPar"></div>
        </div>
        <div class="legend"><span><i class="c"></i>Birdie</span><span><i></i>Bogey</span><span><i class="dd"></i>D Bogey +</span></div>
        <div class="score-wrap" id="udCard"></div>
        <div class="game-foot"><ul class="stations" id="udStations"></ul><button type="button" class="btn ghost" id="udReset">清除計分卡</button></div>
        <div class="stats" id="udStats"></div>
      </section>
    </div>
  </main>

  <footer id="site-footer"></footer>
  <script src="assets/data.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
